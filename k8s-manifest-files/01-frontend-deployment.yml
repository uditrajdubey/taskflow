kind: Deployment
apiVersion: apps/v1
metadata:
  name: frontend-deployment
  labels:
    app: taskflow-fe
  namespace: taskflow-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskflow-fe
  template:
    metadata:
      labels:
        app: taskflow-fe
    spec:
      containers:
        - name: taskflow-frontend-cont
          image: uditsdocker/taskflow-frontend
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "10m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"

